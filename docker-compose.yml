services:
  postgres:
    image: postgres:17-alpine
    container_name: poof-postgres
    environment:
      POSTGRES_USER: poof
      POSTGRES_PASSWORD: poof
      POSTGRES_DB: poof
    ports:
      - "5447:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "poof"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: poof-redis
    ports:
      - "6387:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/supervisor/Dockerfile
      target: build
    profiles: ["app"]
    working_dir: /app/packages/db
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://poof:poof@postgres:5432/poof
    depends_on:
      postgres:
        condition: service_healthy

  supervisor:
    build:
      context: .
      dockerfile: apps/supervisor/Dockerfile
    container_name: poof-supervisor
    profiles: ["app"]
    environment:
      DATABASE_URL: postgresql://poof:poof@postgres:5432/poof
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      BUDGET: "2"
      CAPACITY_CORES: "1.32"
      EXHIBIT_MAX_PROCESSES: "35"
    volumes:
      - ./data/poof:/data
    ports:
      - "3110:3110"
    cpus: 1.5
    mem_limit: 1536m
    pids_limit: 512
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: poof-api
    profiles: ["app"]
    environment:
      DATABASE_URL: postgresql://poof:poof@postgres:5432/poof
      REDIS_URL: redis://redis:6379
      SUPERVISOR_URL: http://supervisor:3110
      DATA_DIR: /data
      ADMIN_TOKEN: local-admin-token-not-for-production
      WEB_ORIGIN: http://localhost:3112
    volumes:
      - ./data/poof:/data:ro
    ports:
      - "3111:3111"
    cpus: 0.5
    mem_limit: 256m
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_LIVE_URL: http://localhost:3111
    container_name: poof-web
    profiles: ["app"]
    environment:
      API_URL: http://api:3111
    ports:
      - "3113:3112"
    cpus: 0.5
    mem_limit: 256m
    depends_on:
      - api

volumes:
  pgdata:
