services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped

  redis:
    ports: !reset []
    cpus: 0.25
    mem_limit: 128m
    restart: unless-stopped

  migrate:
    environment:
      DATABASE_URL: postgresql://poof:${POSTGRES_PASSWORD}@postgres:5432/poof

  supervisor:
    ports: !reset []
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      DATABASE_URL: postgresql://poof:${POSTGRES_PASSWORD}@postgres:5432/poof
      LOG_JSON: "true"
    restart: unless-stopped

  api:
    ports: !reset []
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      DATABASE_URL: postgresql://poof:${POSTGRES_PASSWORD}@postgres:5432/poof
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      TRUST_PROXY: uniquelocal
      LOG_JSON: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3111/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      retries: 6
    networks:
      - default
      - edge
    restart: unless-stopped

  web:
    build:
      args:
        NEXT_PUBLIC_LIVE_URL: ""
    ports: !reset []
    networks:
      - default
      - edge
    restart: unless-stopped

  backup:
    build: ./deploy/backup
    container_name: poof-backup
    profiles: ["app"]
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      PGHOST: postgres
      PGUSER: poof
      PGDATABASE: poof
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RUN_AT: ${BACKUP_AT:-04:30}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    cpus: 0.25
    mem_limit: 128m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  edge:
    name: ${EDGE_NETWORK:?set EDGE_NETWORK}
    external: true
